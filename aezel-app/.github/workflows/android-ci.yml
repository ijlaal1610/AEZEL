name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu runners already include the Android SDK
      # (platforms/build-tools) pre-installed, but we pin the exact
      # platform/build-tools version this project targets explicitly
      # rather than relying on whatever happens to be preinstalled —
      # more reproducible, and won't silently break if the runner image
      # changes what it ships by default.
      - name: Install required Android SDK packages
        run: |
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # Used here purely for its dependency/build caching — actual Gradle
      # invocation below still goes through the committed ./gradlew, this
      # just makes repeat CI runs faster.
      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      # gradle/wrapper/gradle-wrapper.jar IS committed to this repo — a
      # genuine binary fetched directly from gradle/gradle's own GitHub
      # repository (not hand-produced), verified to contain the expected
      # wrapper classes before being committed. So ./gradlew works
      # normally here, same as it would for you locally in Android Studio.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aezel-companion-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
