<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1422" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>
    <linearGradient id="arcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="70%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#ff8a00" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="45%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ff8a00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Hexagonal / Rounded Shield -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#00d4ff" stroke-width="3" stroke-opacity="0.4" />

  <!-- Outer Cockpit Tachometer Arc -->
  <path d="M 28 88 A 46 46 0 1 1 100 88" fill="none" stroke="url(#arcGrad)" stroke-width="7" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Subtle Gauge Tick Marks -->
  <circle cx="28" cy="88" r="3.5" fill="#00d4ff" />
  <circle cx="64" cy="18" r="4" fill="#38bdf8" />
  <circle cx="100" cy="88" r="3.5" fill="#ff8a00" />

  <!-- Central AEZEL Speed Lightning Bolt Motif -->
  <path d="M 68 34 L 46 66 L 62 66 L 56 94 L 82 60 L 66 60 Z" fill="url(#boltGrad)" filter="url(#glow)" />
</svg>
