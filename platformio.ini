; ============================================================================
;  AEZEL — ESP32 Smart Motorcycle Cockpit
;  Target: 2015 Bajaj Avenger 150 (12V negative-ground electrical system)
; ============================================================================

[env:esp32-aezel]
platform = espressif32
board = esp32-s3-devkitc-1        ; swap for esp32dev if using plain ESP32
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -D LV_CONF_INCLUDE_SIMPLE
    -I include

lib_deps =
    lvgl/lvgl@^8.3.11                     ; UI engine (60fps capable, animations, gestures)
    bodmer/TFT_eSPI@^2.5.43               ; display driver (ILI9488 / ST7796 / GC9A01 etc.)
    mikalhart/TinyGPSPlus@^1.0.3          ; GPS NMEA parsing
    adafruit/RTClib@^2.1.4                ; DS3231 RTC
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BusIO@^1.16.1
    adafruit/Adafruit BMP280 Library@^2.6.8   ; altitude / barometric pressure
    adafruit/Adafruit MPU6050@^2.2.6      ; IMU: lean angle, crash/fall detection
    milesburton/DallasTemperature@^3.11.0 ; DS18B20 engine/ambient temp
    paulstoffregen/OneWire@^2.3.7
    bblanchon/ArduinoJson@^7.0.4          ; config / BLE payload / REST API serialization
    h2zero/NimBLE-Arduino@^1.4.1          ; low-RAM BLE stack for companion app
    fbiego/ESP32Time@^2.0.6

; NVS partition sized up for settings + ride-history metadata,
; SPIFFS/LittleFS left for OTA staging + logs. SD card handles bulk
; ride logs / GPX / CSV export (see StorageManager).
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
