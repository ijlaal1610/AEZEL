name: Android CI (Companion App)

on:
  workflow_dispatch:
  push:
    branches: [ main, android-app, gemini-android-app, claude-android-app ]
  pull_request:
    branches: [ main, android-app, gemini-android-app, claude-android-app ]

jobs:
  build:
    name: Build AEZEL Companion Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure valid Gradle Wrapper (8.7) and Build APKs
        run: |
          if [ -d "./aezel-app" ]; then
            cd aezel-app && gradle wrapper --gradle-version 8.7 && chmod +x ./gradlew && ./gradlew assembleDebug assembleRelease --stacktrace
          elif [ -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.7 && chmod +x ./gradlew && ./gradlew assembleDebug assembleRelease --stacktrace
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aezel-companion-apks
          path: |
            app/build/outputs/apk/**/*.apk
            aezel-app/app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
