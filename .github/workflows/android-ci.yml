name: Android CI (Companion App)

on:
  push:
    branches: [ main, android-app, gemini-android-app ]
  pull_request:
    branches: [ main, android-app, gemini-android-app ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build AEZEL Companion Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          elif [ -f "./aezel-app/gradlew" ]; then
            cd aezel-app && chmod +x ./gradlew && ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aezel-companion-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            aezel-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
