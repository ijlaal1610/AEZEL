name: AEZEL Flutter Cross-Platform CI/CD (Android & iOS)

on:
  push:
    branches: [ cross-platform-app, main, gemini ]
  pull_request:
    branches: [ cross-platform-app, main, gemini ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build AEZEL Android APKs (Flutter)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Build Android Release APK
        run: flutter build apk --release --no-shrink

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aezel-flutter-android-apks
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build AEZEL iOS Bundle (Flutter)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App Bundle (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Upload iOS Runner Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aezel-flutter-ios-bundle
          path: build/ios/iphoneos/Runner.app
