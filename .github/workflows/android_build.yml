name: AEZEL Android App CI/CD Build

on:
  workflow_dispatch:
  push:
    branches:
      - android-app
      - gemini-android-app
      - claude-android-app
      - main
  pull_request:
    branches:
      - android-app
      - gemini-android-app
      - claude-android-app
      - main

jobs:
  build-android-app:
    name: Build AEZEL Android APKs (Debug & Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure valid Gradle Wrapper and Build APKs
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Debug & Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aezel-android-app-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
