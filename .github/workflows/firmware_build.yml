name: AEZEL VCU Firmware CI/CD Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - gemini
  pull_request:
    branches:
      - main
      - gemini

jobs:
  build-firmware:
    name: Build ESP32-S3 VCU Firmware (PlatformIO)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build PlatformIO Firmware
        run: pio run -e esp32-phoenix

      - name: Upload Firmware Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aezel-vcu-firmware-bin
          path: .pio/build/esp32-phoenix/firmware.bin
          if-no-files-found: error
