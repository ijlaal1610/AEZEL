name: AEZEL VCU Firmware CI/CD Build

on:
  workflow_dispatch:

jobs:
  build-firmware:
    name: Build ESP32-S3 VCU Firmware (PlatformIO)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Run Native Hardware-Free Unit Tests
        run: |
          g++ -std=c++17 -Iinclude -Isrc test/native/test_vehicle_math.cpp src/VehicleMath.cpp src/VehicleConfig.cpp -o /tmp/test_vehicle_math && /tmp/test_vehicle_math
          g++ -std=c++17 -Iinclude -Isrc test/native/test_vehicle_profile.cpp src/VehicleConfig.cpp -o /tmp/test_vehicle_profile && /tmp/test_vehicle_profile
          g++ -std=c++17 -Iinclude -Isrc test/native/test_hal_linux.cpp src/hal/linux_pi/LinuxGpio.cpp src/hal/linux_pi/LinuxStorage.cpp src/hal/linux_pi/LinuxBle.cpp src/hal/linux_pi/LinuxCan.cpp -o /tmp/test_hal_linux && /tmp/test_hal_linux

      - name: Build PlatformIO Firmware
        run: pio run -e esp32-aezel

      - name: Upload Firmware Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aezel-vcu-firmware-bin
          path: .pio/build/esp32-aezel/firmware.bin
          if-no-files-found: error
